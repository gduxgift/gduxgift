<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐ Магазин звёзд Telegram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s cubic-bezier(.4,0,.2,1); }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000; color: #fff; min-height: 100vh; overflow-x: hidden;
      display: flex; justify-content: center; align-items: center;
    }
    .welcome {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; background: #000; z-index: 1000;
      opacity: 1; transition: opacity 0.6s, transform 0.6s;
    }
    .welcome.hidden { opacity: 0; transform: scale(0.9); pointer-events: none; }
    .rocket-img {
      width: 220px; height: auto; animation: rocketFloat 2s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(255,150,0,0.5));
    }
    @keyframes rocketFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-25px) rotate(3deg); }
    }
    .welcome-title {
      font-size: 3.2rem; font-weight: 800; margin: 30px 0;
      background: linear-gradient(135deg, #ff8c00, #ffd700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; letter-spacing: 2px;
    }
    .btn-next {
      background: linear-gradient(135deg, #ff8c00, #ff5722); color: #fff;
      border: none; border-radius: 50px; padding: 18px 70px; font-size: 1.5rem;
      font-weight: 700; cursor: pointer; box-shadow: 0 10px 30px rgba(255,140,0,0.4);
    }
    .btn-next:hover { transform: scale(1.08); box-shadow: 0 15px 40px rgba(255,140,0,0.6); }

    .app { display: none; width: 100%; max-width: 1200px; margin: 20px; opacity: 0; transition: opacity 0.8s; }
    .app.visible { display: block; opacity: 1; }

    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      background: #1a1a1a; border-radius: 30px; padding: 15px 25px; margin-bottom: 25px;
    }
    .menu-icons { display: flex; flex-wrap: wrap; gap: 15px; }
    .menu-item {
      display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06);
      border-radius: 30px; padding: 12px 20px; cursor: pointer;
    }
    .menu-item:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }

    .user-area { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    .balance-pill {
      background: rgba(0,255,150,0.1); border: 2px solid rgba(0,255,150,0.3);
      border-radius: 50px; padding: 10px 22px; font-weight: 700; cursor: pointer;
    }
    .balance-pill:hover { background: rgba(0,255,150,0.2); }

    .main-frame { background: #111; border-radius: 30px; padding: 30px; min-height: 400px; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .big-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .big-menu button { background: #222; border: none; border-radius: 20px; padding: 25px 10px; color: #fff; font-size: 1.1rem; cursor: pointer; }
    .big-menu button:hover { background: #333; transform: scale(1.03); }

    .view { display: none; }
    .view.active { display: block; }

    .deposit-box {
      background: #1a1a1a; border-radius: 20px; padding: 25px;
      max-width: 400px; margin: 20px auto; text-align: center;
    }
    .deposit-box label { display: block; margin-bottom: 10px; font-size: 1.1rem; color: #ccc; }
    .deposit-box input {
      width: 100%; background: #222; border: 1px solid #444; border-radius: 30px;
      padding: 14px 20px; color: #fff; font-size: 1.2rem; outline: none; text-align: center;
    }
    .deposit-box input:focus { border-color: #2196F3; }
    .deposit-box .btn-blue {
      display: inline-block; margin-top: 15px; background: #2196F3; color: #fff;
      border: none; border-radius: 30px; padding: 14px 40px; font-size: 1.2rem;
      font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.3s;
    }
    .deposit-box .btn-blue:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(33,150,243,0.4); }
    .deposit-box .btn-blue.disabled { opacity: 0.4; pointer-events: none; }

    .purchase-item { background: #1e1e1e; border-radius: 15px; padding: 12px 15px; margin: 8px 0; display: flex; justify-content: space-between; }

    textarea { width: 100%; background: #222; border: 1px solid #333; border-radius: 15px; padding: 15px; color: #fff; resize: vertical; margin: 10px 0; }
    .btn-orange { background: linear-gradient(135deg, #ff8c00, #ff5722); border: none; border-radius: 30px; padding: 14px 40px; font-weight: 700; cursor: pointer; color: #fff; }
    .btn-orange:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(255,140,0,0.4); }

    .complaint-box { background: #1e1e1e; border-left: 3px solid #ffd700; padding: 8px; margin: 5px 0; border-radius: 8px; }

    @media (max-width: 700px) { .topbar { flex-direction: column; gap: 10px; } .main-frame { padding: 15px; } .welcome-title { font-size: 2rem; } }
  </style>
</head>
<body>

<!-- Приветствие (теперь просто переход в приложение) -->
<div class="welcome" id="welcomeScreen">
  <img src="https://avatars.mds.yandex.net/i?id=1464c9e382a7a07688d1fa8cc5de847a5f20b684-10640295-images-thumbs&n=13" alt="Rocket" class="rocket-img">
  <h1 class="welcome-title">Добро пожаловать</h1>
  <button class="btn-next" onclick="enterSite()">Далее</button>
</div>

<!-- Основное приложение -->
<div class="app" id="app">
  <div class="topbar">
    <div class="menu-icons">
      <div class="menu-item" onclick="showView('cart')"><i>🛒</i> Корзина</div>
      <div class="menu-item" onclick="showView('support')"><i>✉️</i> Поддержка</div>
      <div class="menu-item" onclick="showView('balance')"><i>💰</i> Баланс</div>
      <div class="menu-item" onclick="showView('shop')"><i>⭐</i> Магазин</div>
      <div class="menu-item" onclick="showView('settings')"><i>⚙️</i> Настройки</div>
    </div>
    <div class="user-area">
      <!-- Баланс в шапке без аватарки и логина -->
      <span class="balance-pill" onclick="showView('balance')">💰 0.0 ₽</span>
    </div>
  </div>

  <div class="main-frame">
    <div id="mainMenu" class="view active">
      <h2 style="text-align:center; margin-bottom:20px;">Добро пожаловать!</h2>
      <div class="big-menu">
        <button onclick="showView('shop')">🛍️ Магазин</button>
        <button onclick="showView('cart')">🛒 Корзина</button>
        <button onclick="showView('balance')">💰 Баланс</button>
        <button onclick="showView('support')">✉️ Поддержка</button>
        <button onclick="showView('settings')">⚙️ Настройки</button>
      </div>
    </div>

    <div id="shopView" class="view">
      <h2 style="margin-bottom:20px;">Магазин звёзд</h2>
      <div style="background:#1e1e1e; border-radius:20px; padding:20px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>⭐ Звезда Telegram</strong><br><span>Цена: 150 ₽</span></div>
        <button class="btn-orange" onclick="buyStar('Звезда', 150)">Купить</button>
      </div>
      <div style="background:#1e1e1e; border-radius:20px; padding:20px; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>⭐ Премиум-звезда</strong><br><span>Цена: 300 ₽</span></div>
        <button class="btn-orange" onclick="buyStar('Премиум-звезда', 300)">Купить</button>
      </div>
      <br>
      <button class="btn-orange" onclick="showView('mainMenu')">⬅ Вернуться</button>
    </div>

    <div id="cartView" class="view">
      <h2 style="margin-bottom:20px;">История покупок</h2>
      <div id="cartList"></div>
      <br>
      <button class="btn-orange" onclick="showView('mainMenu')">⬅ Назад</button>
    </div>

    <div id="balanceView" class="view">
      <h2 style="margin-bottom:10px;">Пополнить баланс</h2>
      <p style="color:#aaa; margin-bottom:20px;">Текущий баланс: <span id="balanceAmount">0.0</span> ₽</p>
      <div class="deposit-box">
        <label for="depositAmount">Введите сумму в рублях</label>
        <input type="number" id="depositAmount" placeholder="Например, 500" min="1" step="1">
        <a id="depositBtn" class="btn-blue disabled" href="https://www.donationalerts.com/r/starsgift" target="_blank">Пополнить</a>
      </div>
      <br>
      <button class="btn-orange" onclick="showView('mainMenu')">⬅ Назад</button>
    </div>

    <div id="supportView" class="view">
      <h2 style="margin-bottom:20px;">Поддержка</h2>
      <textarea id="complaintText" rows="4" placeholder="Опишите проблему..."></textarea>
      <button class="btn-orange" onclick="sendComplaint()">Отправить</button>
      <br><br>
      <div id="userComplaints"></div>
      <br>
      <button class="btn-orange" onclick="showView('mainMenu')">⬅ Назад</button>
    </div>

    <div id="settingsView" class="view">
      <h2 style="margin-bottom:20px;">Настройки</h2>
      <p style="margin-bottom:10px;">Цвет темы:</p>
      <div>
        <span style="display:inline-block;width:40px;height:40px;border-radius:50%;background:#000;border:2px solid #ff8c00;cursor:pointer;" onclick="setTheme('black')"></span>
        <span style="display:inline-block;width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #ff8c00;cursor:pointer;margin-left:10px;" onclick="setTheme('white')"></span>
      </div>
      <br>
      <button class="btn-orange" onclick="showView('mainMenu')">⬅ Назад</button>
    </div>
  </div>
</div>

<script>
  // ===================== ДАННЫЕ (гость) =====================
  let currentBalance = parseFloat(localStorage.getItem('guestBalance')) || 0;
  let purchaseHistory = JSON.parse(localStorage.getItem('guestHistory')) || [];
  let complaints = JSON.parse(localStorage.getItem('guestComplaints')) || [];

  // ===================== ПЕРВЫЙ ЭКРАН =====================
  function enterSite() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('app').classList.add('visible');
    updateUI();
    // активация кнопки пополнения
    const depositInput = document.getElementById('depositAmount');
    const depositBtn = document.getElementById('depositBtn');
    depositInput.addEventListener('input', function() {
      const val = parseFloat(this.value);
      if (val > 0) {
        depositBtn.classList.remove('disabled');
      } else {
        depositBtn.classList.add('disabled');
      }
    });
  }

  function updateUI() {
    document.getElementById('balanceAmount').textContent = currentBalance.toFixed(1);
    document.querySelector('.balance-pill').innerHTML = `💰 ${currentBalance.toFixed(1)} ₽`;
    renderCart();
    renderComplaints();
  }

  // ===================== ПЕРЕКЛЮЧЕНИЕ ВЬЮ =====================
  function showView(viewName) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    if (viewName === 'mainMenu') document.getElementById('mainMenu').classList.add('active');
    else if (viewName === 'cart') { document.getElementById('cartView').classList.add('active'); renderCart(); }
    else if (viewName === 'support') { document.getElementById('supportView').classList.add('active'); renderComplaints(); }
    else if (viewName === 'balance') { document.getElementById('balanceView').classList.add('active'); document.getElementById('balanceAmount').textContent = currentBalance.toFixed(1); }
    else if (viewName === 'shop') document.getElementById('shopView').classList.add('active');
    else if (viewName === 'settings') document.getElementById('settingsView').classList.add('active');
  }

  // ===================== ПОКУПКИ =====================
  function buyStar(name, price) {
    if (currentBalance < price) { alert('Недостаточно средств.'); return; }
    currentBalance -= price;
    purchaseHistory.push({ name, price, date: new Date().toLocaleString() });
    localStorage.setItem('guestBalance', currentBalance);
    localStorage.setItem('guestHistory', JSON.stringify(purchaseHistory));
    updateUI();
    alert(`Куплено: ${name} за ${price} ₽`);
  }

  function renderCart() {
    const list = document.getElementById('cartList');
    if (purchaseHistory.length === 0) {
      list.innerHTML = '<p style="color:#aaa;">Покупок нет.</p>';
    } else {
      list.innerHTML = purchaseHistory.map(item => `<div class="purchase-item"><span>${item.name}</span><span>${item.price} ₽</span></div>`).join('');
    }
  }

  // ===================== ПОДДЕРЖКА =====================
  function sendComplaint() {
    const text = document.getElementById('complaintText').value.trim();
    if (!text) { alert('Напишите текст жалобы.'); return; }
    complaints.push({ user: 'guest', text, date: new Date().toLocaleString() });
    localStorage.setItem('guestComplaints', JSON.stringify(complaints));
    document.getElementById('complaintText').value = '';
    alert('Жалоба отправлена!');
    renderComplaints();
  }

  function renderComplaints() {
    const container = document.getElementById('userComplaints');
    if (complaints.length === 0) {
      container.innerHTML = '<p style="color:#aaa;">Вы ещё не отправляли жалоб.</p>';
    } else {
      container.innerHTML = complaints.map(c => `<div class="complaint-box">${c.text} <small>(${c.date})</small></div>`).join('');
    }
  }

  // ===================== НАСТРОЙКИ =====================
  function setTheme(color) {
    if (color === 'white') {
      document.body.style.background = '#fff';
      document.body.style.color = '#111';
      document.querySelectorAll('.main-frame, .topbar, .bal-card, .modal').forEach(el => el.style.background = '#eee');
    } else {
      document.body.style.background = '#000';
      document.body.style.color = '#fff';
      document.querySelectorAll('.main-frame, .topbar, .bal-card, .modal').forEach(el => el.style.background = '#111');
    }
  }
</script>
</body>
</html>
