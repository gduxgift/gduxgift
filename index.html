<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gduxgift</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f9; color: #2d3748; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Красная вылетающая табличка */
        .toast { position: fixed; top: -60px; background: #ff4d4d; color: #fff; padding: 12px 25px; border-radius: 6px; font-weight: 600; z-index: 1000; transition: top 0.3s; }
        .toast.show { top: 20px; }

        /* Шапка */
        .navbar { display: none; width: 100%; background: #fff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, #ff6a00, #ee0979); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu { display: flex; gap: 20px; font-weight: 600; cursor: pointer; }
        .profile { display: flex; align-items: center; gap: 10px; border-left: 1px solid #e2e8f0; padding-left: 15px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ff6a00; object-fit: cover; }
        .logout { font-size: 0.75rem; color: #a0aec0; cursor: pointer; background: none; border: none; font-weight: bold; }

        /* Окна входа/регистрации */
        .welcome { text-align: center; margin-top: 60px; width: 100%; max-width: 360px; }
        h1 { margin-bottom: 20px; text-transform: uppercase; font-size: 1.6rem; }
        .box { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: left; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: 2px solid #ff6a00; color: #ff6a00; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: #ff6a00; color: #fff; }
        .form-block { display: none; }
        .form-block.active { display: block; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 5px 0 10px; border: 1px solid #cbd5e0; border-radius: 6px; outline: none; }
        .btn { width: 100%; padding: 12px; background: #ff6a00; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .forgot { display: inline-block; margin-top: 10px; font-size: 0.8rem; color: #ff6a00; text-decoration: none; font-weight: 600; }
        
        #content { display: none; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header class="navbar" id="navbar">
        <div class="logo">gduxgift</div>
        <nav class="menu">
            <div>🛒 Корзина</div>
            <div>🎧 Поддержка</div>
            <div>💰 Баланс: 0 ₽</div>
            <div>⚙️ Настройки</div>
        </nav>
        <div class="profile">
            <img src="" class="avatar" id="avatar" alt="pic">
            <div><b id="user"></b><br><button class="logout" onclick="logout()">Выйти</button></div>
        </div>
    </header>

    <main class="welcome" id="welcome">
        <h1>Добро пожаловать</h1>
        <div class="box">
            <div class="tabs">
                <button class="tab-btn active" id="t-reg" onclick="switchTab('reg')">Регистрация</button>
                <button class="tab-btn" id="t-log" onclick="switchTab('log')">Войти</button>
            </div>

            <div id="block-reg" class="form-block active">
                <label>Telegram (без @)</label><input type="text" id="reg-tg" placeholder="durov">
                <label>Почта</label><input type="email" id="reg-email" placeholder="mail@mail.com">
                <label>Пароль</label><input type="password" id="reg-p1">
                <label>Повтор пароль</label><input type="password" id="reg-p2">
                <button class="btn" onclick="auth('reg')">Создать аккаунт</button>
            </div>

            <div id="block-log" class="form-block">
                <label>Telegram (без @)</label><input type="text" id="log-tg" placeholder="durov">
                <label>Пароль</label><input type="password" id="log-p">
                <button class="btn" onclick="auth('log')">Войти</button>
                <a href="#" class="forgot" onclick="forgot(event)">Забыли пароль?</a>
            </div>
        </div>
    </main>

    <div id="content"><h2>🎉 Вы успешно зашли в gduxgift!</h2></div>

    <!-- Подключаем библиотеку EmailJS -->
    <script src="https://jsdelivr.net"></script>

    <script>
        window.onload = function() {
            const session = localStorage.getItem('gdux_session');
            if (session) show(session);
        };

        function toast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function forgot(e) {
            e.preventDefault();
            const user = document.getElementById('log-tg').value.trim();
            let db = JSON.parse(localStorage.getItem('gdux_db')) || {};
            
            if (!user) return toast("Введите Telegram юзернейм в поле ввода!");
            if (!db[user]) return toast("Аккаунт не найден!");

            // Проверяем формат аккаунта (старый или новый)
            const isObject = typeof db[user] === 'object';
            const userEmail = isObject ? db[user].email : null;
            const userPassword = isObject ? db[user].password : db[user];

            // Если аккаунт старый и в нём нет почты
            if (!userEmail) {
                alert(`Ваш старый аккаунт не привязан к почте. Ваш пароль: ${userPassword}`);
                return;
            }

            toast("Отправляем пароль на вашу почту...");

            // КЛЮЧИ EMAILJS (Замени на свои из личного кабинета)
            const SERVICE_ID = 'service_mkyq5cl'; 
            const TEMPLATE_ID = 'YOUR_TEMPLATE_ID'; 
            const PUBLIC_KEY = 'YOUR_PUBLIC_KEY'; 

            emailjs.init(PUBLIC_KEY);

            const templateParams = {
                to_email: userEmail,
                telegram_user: user,
                user_password: userPassword
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(function() {
                    alert(`Пароль успешно отправлен на почту ${userEmail}!`);
                }, function(error) {
                    toast("Ошибка отправки: " + JSON.stringify(error));
                });
        }

        function switchTab(type) {
            document.getElementById('block-reg').classList.toggle('active', type === 'reg');
            document.getElementById('block-log').classList.toggle('active', type === 'log');
            document.getElementById('t-reg').classList.toggle('active', type === 'reg');
            document.getElementById('t-log').classList.toggle('active', type === 'log');
        }

        function auth(mode) {
            let db = JSON.parse(localStorage.getItem('gdux_db')) || {};

            if (mode === 'reg') {
                const u = document.getElementById('reg-tg').value.trim();
                const e = document.getElementById('reg-email').value.trim();
                const p1 = document.getElementById('reg-p1').value;
                const p2 = document.getElementById('reg-p2').value;

                if (!u || !e || !p1 || !p2) return toast("Заполните все поля!");
                if (p1 !== p2) return toast("Пароли не совпадают!");
                if (db[u]) return toast("Этот аккаунт уже зарегистрирован!");

                db[u] = { password: p1, email: e };
                localStorage.setItem('gdux_db', JSON.stringify(db));
                localStorage.setItem('gdux_session', u);
                show(u);
            } else {
                const u = document.getElementById('log-tg').value.trim();
                const p = document.getElementById('log-p').value;

                if (!u || !p) return toast("Заполните все поля!");

                if (db[u]) {
                    // Исправлено: корректно считывает и строку, и объект
                    const savedPassword = typeof db[u] === 'object' ? db[u].password : db[u];

                    if (savedPassword === p) {
                        localStorage.setItem('gdux_session', u);
                        show(u);
                    } else {
                        toast("Неверный логин или пароль!");
                    }
                } else {
                    toast("Неверный логин или пароль!");
                }
            }
        }

        function show(u) {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('user').innerText = `@${u}`;
            document.getElementById('avatar').src = `https://robohash.org{u}.png?set=set4`;
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('content').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('gdux_session');
            window.location.reload();
        }
    </script>
</body>
</html>
