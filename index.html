<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        /* Сброс базовых отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Мягкий неяркий белый фон */
        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            color: #2d3748;
        }

        /* Заголовок сверху */
        .top-title {
            font-size: 2.3rem;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a202c;
            text-align: center;
        }

        /* Блок регистрации */
        .auth-container {
            background: #ffffff;
            max-width: 400px;
            width: 100%;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .form-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #4a5568;
            text-align: center;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #718096;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #ff6a00;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.15);
        }

        /* Оранжевая кнопка регистрации */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ff6a00;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            background: #e65c00;
        }

        /* --- ИНТЕРФЕЙС САЙТА ПОСЛЕ ВХОДА (по умолчанию скрыт) --- */
        .main-dashboard {
            display: none; /* Скрипт переключит на block */
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.5s ease forwards;
        }

        /* Верхняя панель: Аватарка из ТГ и ссылка на Профиль */
        .user-profile-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            width: fit-content; /* Ширина по контенту */
        }

        /* Круглый аватар из Telegram */
        .tg-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff6a00;
            background-color: #cbd5e0;
        }

        .profile-link {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ff6a00;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .profile-link:hover {
            color: #e65c00;
            text-decoration: underline;
        }

        /* Длинная рамка-меню (без профиля и аватарки внутри) */
        .long-menu-frame {
            background: #ffffff;
            width: 100%;
            padding: 25px 35px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: space-between; /* Элементы растянуты по ширине рамки */
            align-items: center;
        }

        /* Элементы внутри длинной рамки */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .menu-item:hover {
            color: #ff6a00;
            background: #fffaf0;
        }

        .menu-item span.icon {
            font-size: 1.3rem;
        }

        /* Анимация плавного появления личного кабинета */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <h1 class="top-title" id="siteTitle">Добро пожаловать</h1>

    <!-- 1. ФОРМА РЕГИСТРАЦИИ -->
    <div class="auth-container" id="authBlock">
        <form onsubmit="handleFastRegister(event)">
            <div class="form-title">Регистрация аккаунта</div>
            
            <div class="input-group">
                <label>Юзернейм Telegram (без знака @)</label>
                <input type="text" id="tgUser" placeholder="durov" required>
            </div>
            
            <div class="input-group">
                <label>Электронная почта</label>
                <input type="email" placeholder="example@mail.com" required>
            </div>
            
            <div class="input-group">
                <label>Придумайте пароль</label>
                <input type="password" id="pass1" placeholder="Введите пароль" required>
            </div>
            
            <div class="input-group">
                <label>Подтвердите пароль</label>
                <input type="password" id="pass2" placeholder="Повторите пароль" required>
            </div>
            
            <button type="submit" class="submit-btn">Зарегистрироваться</button>
        </form>
    </div>

    <!-- 2. ИНТЕРФЕЙС ПОСЛЕ РЕГИСТРАЦИИ (Длинная рамка и аватар) -->
    <div class="main-dashboard" id="dashboardBlock">
        
        <!-- Аватарка и ссылка «Профиль» находятся РЯДОМ снаружи рамки -->
        <div class="user-profile-bar">
            <img src="" alt="Avatar" class="tg-avatar" id="userAvatar">
            <a href="#" class="profile-link" id="profileName">Профиль (@username)</a>
        </div>

        <!-- Длинная рамка меню: Корзина, Поддержка, Баланс -->
        <div class="long-menu-frame">
            <div class="menu-item">
                <span class="icon">🛒</span>
                <span>Корзина</span>
            </div>
            <div class="menu-item">
                <span class="icon">🎧</span>
                <span>Поддержка</span>
            </div>
            <div class="menu-item">
                <span class="icon">💰</span>
                <span>Баланс: 0 ₽</span>
            </div>
        </div>

    </div>

    <script>
        function handleFastRegister(event) {
            event.preventDefault(); // Защита от перезагрузки страницы

            const username = document.getElementById('tgUser').value.trim();
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;

            // Сверка паролей
            if (p1 !== p2) {
                alert("Ошибка: Введенные пароли не совпадают!");
                return;
            }

            // Убираем форму регистрации
            document.getElementById('authBlock').style.display = 'none';
            
            // Динамически меняем аватарку, используя юзернейм Telegram
            // unavatar.io автоматически парсит открытые аватарки из соцсетей напрямую в тег img
            const avatarUrl = `https://unavatar.io{username}`;
            const avatarImg = document.getElementById('userAvatar');
            avatarImg.src = avatarUrl;

            // Если у пользователя скрыта аватарка в ТГ, ставим стандартный заглушечный аватар
            avatarImg.onerror = function() {
                this.src = 'https://dicebear.com' + username;
            };

            // Обновляем текст ссылки профиля под введенный логин
            document.getElementById('profileName').innerText = `Профиль (@${username})`;
            
            // Меняем заголовок сайта
            document.getElementById('siteTitle').innerText = "Личный кабинет";

            // Мгновенно отображаем длинную рамку и профиль
            document.getElementById('dashboardBlock').style.style.display = 'block';
            document.getElementById('dashboardBlock').style.display = 'block';
        }
    </script>

</body>
</html>
