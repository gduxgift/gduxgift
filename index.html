<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        /* Обнуление отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Мягкий, не яркий белый фон (матовый светло-серый оттенок) */
        body {
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            color: #333333;
        }

        /* Заголовок в самом верху */
        .top-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2c3e50;
            text-align: center;
        }

        /* Основной контейнер формы */
        .auth-container {
            background: #ffffff;
            max-width: 400px;
            width: 100%;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f5;
        }

        /* Заголовки внутри подблоков */
        .form-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #4a5568;
            text-align: center;
            font-weight: 600;
        }

        /* Стили полей ввода */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #718096;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f8fafc;
            color: #2d3748;
            transition: all 0.2s ease;
            outline: none;
        }

        /* Фокус на поле ввода */
        .input-group input:focus {
            border-color: #ff6a00;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.15);
        }

        /* Главная кнопка отправки формы внутри блоков */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ff6a00;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #e65c00;
        }

        /* Панель с двумя оранжевыми кнопками переключения внизу */
        .switch-tabs {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            width: 100%;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: 2px solid #ff6a00;
            color: #ff6a00;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Стиль для активной кнопки переключения */
        .tab-btn.active {
            background: #ff6a00;
            color: #ffffff;
        }

        .tab-btn:hover {
            background: #ff6a00;
            color: #ffffff;
        }

        /* Скрытие неактивной формы по умолчанию */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Вверху «Добро пожаловать» -->
    <h1 class="top-title">Добро пожаловать</h1>

    <div class="auth-container">
        
        <!-- ФОРМА РЕГИСТРАЦИИ (Активна при первом входе) -->
        <form id="registerForm" class="auth-form active" onsubmit="handleRegister(event)">
            <div class="form-title">Регистрация</div>
            
            <div class="input-group">
                <label>Юзернейм Telegram</label>
                <input type="text" id="regUser" placeholder="@username" required>
            </div>
            
            <div class="input-group">
                <label>Электронная почта</label>
                <input type="email" id="regEmail" placeholder="example@mail.com" required>
            </div>
            
            <div class="input-group">
                <label>Придумайте пароль</label>
                <input type="password" id="regPass" placeholder="Минимум 6 символов" required>
            </div>
            
            <div class="input-group">
                <label>Подтвердите пароль</label>
                <input type="password" id="regPassConfirm" placeholder="Повторите пароль" required>
            </div>
            
            <button type="submit" class="submit-btn">Создать аккаунт</button>
        </form>

        <!-- ФОРМА ВХОДА -->
        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-title">Войти в аккаунт</div>
            
            <div class="input-group">
                <label>Юзернейм Telegram</label>
                <input type="text" id="logUser" placeholder="@username" required>
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="logPass" placeholder="Введите ваш пароль" required>
            </div>
            
            <button type="submit" class="submit-btn">Войти</button>
        </form>

        <!-- Внизу две оранжевые кнопки переключения -->
        <div class="switch-tabs">
            <button type="button" class="tab-btn active" id="tabReg" onclick="switchForm('register')">Зарегистрироваться</button>
            <button type="button" class="tab-btn" id="tabLog" onclick="switchForm('login')">Войти</button>
        </div>

    </div>

    <!-- Простая логика работы полей и сохранения паролей -->
    <script>
        // Переключение между вкладками Войти / Зарегистрироваться
        function switchForm(type) {
            const regForm = document.getElementById('registerForm');
            const loginForm = document.getElementById('loginForm');
            const tabReg = document.getElementById('tabReg');
            const tabLog = document.getElementById('tabLog');

            if (type === 'register') {
                regForm.classList.add('active');
                loginForm.classList.remove('active');
                tabReg.classList.add('active');
                tabLog.classList.remove('active');
            } else {
                loginForm.classList.add('active');
                regForm.classList.remove('active');
                tabLog.classList.add('active');
                tabReg.classList.remove('active');
            }
        }

        // Временная база данных в памяти браузера
        let savedUser = "";
        let savedPassword = "";

        // Обработка регистрации
        function handleRegister(event) {
            event.preventDefault();
            
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const passConfirm = document.getElementById('regPassConfirm').value;

            if (pass !== passConfirm) {
                alert("Ошибка: Пароли не совпадают!");
                return;
            }

            // Сохраняем данные локально
            savedUser = user;
            savedPassword = pass;

            alert("Регистрация успешна! Теперь вы можете войти, используя свой Telegram и пароль.");
            switchForm('login'); // Автоматически переключаем на форму Входа
            document.getElementById('logUser').value = savedUser; // Сразу подставляем логин
        }

        // Обработка входа
        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('logUser').value.trim();
            const pass = document.getElementById('logPass').value;

            if (!savedUser) {
                alert("Ошибка: Сначала пройдите регистрацию!");
                return;
            }

            // Проверка введенных данных с теми, что придумали при регистрации
            if (user === savedUser && pass === savedPassword) {
                alert("Успешный вход! Добро пожаловать на сайт.");
            } else {
                alert("Неверный юзернейм Telegram или пароль!");
            }
        }
    </script>

</body>
</html>
