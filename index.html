<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gduxgift</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f9; color: #2d3748; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Верхняя рамка-меню */
        .navbar { display: none; width: 100%; background: #fff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, #ff6a00, #ee0979); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu { display: flex; gap: 20px; font-weight: 600; cursor: pointer; }
        .profile { display: flex; align-items: center; gap: 10px; border-left: 1px solid #e2e8f0; padding-left: 15px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ff6a00; object-fit: cover; }
        .logout { font-size: 0.75rem; color: #a0aec0; cursor: pointer; background: none; border: none; }
        .logout:hover { color: #e53e3e; }

        /* Форма регистрации */
        .welcome { text-align: center; margin-top: 80px; width: 100%; max-width: 360px; padding: 0 10px; }
        h1 { margin-bottom: 25px; text-transform: uppercase; }
        .form { background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: left; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e0; border-radius: 6px; outline: none; }
        input:focus { border-color: #ff6a00; }
        button.btn { width: 100%; padding: 12px; background: #ff6a00; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        #content { display: none; margin-top: 50px; text-align: center; }
    </style>
</head>
<body>

    <!-- Меню на самом верху -->
    <header class="navbar" id="navbar">
        <div class="logo">gduxgift</div>
        <nav class="menu">
            <div>🛒 Корзина</div>
            <div>🎧 Поддержка</div>
            <div>💰 Баланс: 0 ₽</div>
            <div>⚙️ Настройки</div>
        </nav>
        <div class="profile">
            <img src="" class="avatar" id="avatar">
            <div>
                <b id="user"></b><br>
                <button class="logout" onclick="logout()">Выйти</button>
            </div>
        </div>
    </header>

    <!-- Экран регистрации -->
    <main class="welcome" id="welcome">
        <h1>Добро пожаловать</h1>
        <form class="form" onsubmit="register(event)">
            <label>Твой Telegram (без @)</label>
            <input type="text" id="tg" placeholder="durov" required>
            <label>Почта</label>
            <input type="email" required>
            <label>Пароль</label>
            <input type="password" id="p1" required>
            <label>Повтор пароля</label>
            <input type="password" id="p2" required>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
    </main>

    <!-- Контент после входа -->
    <div id="content">
        <h2>🎉 Успешный вход в gduxgift!</h2>
    </div>

    <script>
        window.onload = function() {
            const user = localStorage.getItem('tg_user');
            if (user) show(user);
        };

        function register(event) {
            event.preventDefault();
            const name = document.getElementById('tg').value.trim();
            if (document.getElementById('p1').value !== document.getElementById('p2').value) return alert("Пароли не совпадают");
            
            localStorage.setItem('tg_user', name);
            show(name);
        }

        function show(name) {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('user').innerText = `@${name}`;
            
            const img = document.getElementById('avatar');
            img.src = `https://unavatar.io{name}`;
            img.onerror = () => img.src = `https://dicebear.com{name}`;

            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('content').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('tg_user');
            window.location.reload();
        }
    </script>
</body>
</html>
