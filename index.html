<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StarShop</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --bg: #111; --text: #fff; --box: #222; }
        .light { --bg: #fff; --text: #000; --box: #eee; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; font-weight: 900; } /* Жирный шрифт */
        body { background: var(--bg); color: var(--text); padding-top: 70px; }
        header { background: #000; color: #fff; padding: 15px; display: flex; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 10; }
        button { background: #0088cc; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .sec { max-width: 500px; margin: 40px auto; padding: 20px; background: var(--box); border-radius: 8px; display: none; text-align: center; }
        .active { display: block !important; }
        #welcome { display: block; background: transparent; }
        .w-title { background: #fff; color: #000; display: inline-block; padding: 10px 20px; border-radius: 5px; font-size: 2.2rem; }
        .rocket-zone { margin: 25px 0; }
        .tg-rocket { font-size: 80px; color: #24A1DE; transform: rotate(-45deg); display: inline-block; animation: fly 2s infinite ease-in-out; }
        @keyframes fly { 0%, 100% { transform: rotate(-45deg) translateY(0); } 50% { transform: rotate(-45deg) translateY(-15px); } }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        .light input, .light select { background: #fff; color: #000; border: 1px solid #ccc; }
        .rep { display: flex; justify-content: space-between; background: #333; padding: 10px; margin: 5px 0; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>

    <!-- Черное меню -->
    <header>
        <div>⭐ StarShop</div>
        <div id="menu" style="display:none;">
            <button onclick="sc('sett')">⚙️</button>
            <button onclick="sc('bal')">💰 Баланс (<span id="mBal">0</span>₽)</button>
            <button onclick="sc('cart')">🛒 Корзина</button>
            <button onclick="sc('supp')">🛠️ Поддержка</button>
            <button onclick="sc('prof')">👤 Профиль</button>
            <button onclick="sc('adm')" id="mAdm" style="display:none; background:#d9534f;">👨‍💻 Админка</button>
        </div>
        <!-- В правом верхнем углу -->
        <div id="auth">
            <button onclick="openAuth('reg')">Зарегаться</button>
            <button onclick="openAuth('log')">Войти</button>
        </div>
    </header>

    <!-- По середине сайта приветствие и ракета -->
    <section id="welcome" class="sec active">
        <h1 class="w-title">Добро пожаловать</h1>
        <div class="rocket-zone"><i class="fa-solid fa-paper-plane tg-rocket"></i></div>
        <button onclick="goNext()" style="padding:10px 30px;">Далее</button>
    </section>

    <section id="aForm" class="sec">
        <h2 id="aTitle">Вход</h2>
        <input type="email" id="aEmail" placeholder="Почта">
        <input type="password" id="aPass" placeholder="Пароль">
        <button onclick="sign()" style="width:100%; padding:10px;">Продолжить</button>
    </section>

    <section id="sett" class="sec">
        <h2>Цвет меню (Тема)</h2>
        <button onclick="document.body.classList.remove('light')" style="background:#000;">Черный</button>
        <button onclick="document.body.classList.add('light')" style="background:#fff; color:#000;">Белый</button>
    </section>

    <section id="bal" class="sec">
        <h2>Пополнение баланса</h2>
        <select id="bSum">
            <option value="500">500 ₽</option><option value="1000">1000 ₽</option>
            <option value="1500">1500 ₽</option><option value="2000">2000 ₽</option>
            <option value="2500">2500 ₽</option>
        </select>
        <button onclick="addB()" style="width:100%;">Пополнить</button>
    </section>

    <section id="cart" class="sec">
        <h2>Корзина</h2>
        <button onclick="buy()" style="width:100%; padding:10px; margin-bottom:10px;">Купить Звезды</button>
        <div id="cOut"></div>
    </section>

    <section id="supp" class="sec">
        <h2>Поддержка</h2>
        <input type="text" id="sMsg" placeholder="Ваш вопрос...">
        <button onclick="sendR()" style="width:100%;">Отправить репорт</button>
    </section>

    <section id="prof" class="sec">
        <h1 id="pAdm" style="color:red; display:none; margin-bottom:10px;">АДМИН</h1>
        <h2>Профиль: <span id="pNick" style="color:#0088cc;">User</span></h2>
        <input type="text" id="nNick" placeholder="Сменить ник"><input type="password" id="nPass" placeholder="Сменить пароль">
        <input type="email" id="nEmail" placeholder="Сменить почту"><input type="text" id="nAva" placeholder="Ссылка на аватар">
        <button onclick="saveP()">Сохранить</button>
        <button onclick="location.reload()" style="background:#d9534f;">Выйти</button>
    </section>

    <section id="adm" class="sec">
        <h2 style="color:red; margin-bottom:10px;">Админ Панель xudex</h2>
        <div id="aReps"></div>
    </section>

    <script>
        let u = null, mode = 'reg', reps = [];
        function sc(id) { 
            if(!u && id !== 'welcome' && id !== 'aForm') return alert('Нужен вход!');
            document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function goNext() { u ? sc('prof') : openAuth('reg'); }
        function openAuth(m) { mode = m; document.getElementById('aTitle').innerText = m === 'reg' ? 'Регистрация' : 'Вход'; sc('aForm'); }
        function sign() {
            let em = document.getElementById('aEmail').value, pas = document.getElementById('aPass').value;
            if(!em || !pas) return alert('Заполните поля');
            u = { em: em, nick: em.split('@')[0], bal: 0, adm: (mode==='log' && pas==='xudex') };
            document.getElementById('auth').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            if(u.adm) { document.getElementById('mAdm').style.display = 'block'; document.getElementById('pAdm').style.display = 'block'; }
            upd(); sc('prof');
        }
        function upd() { document.getElementById('mBal').innerText = u.bal; document.getElementById('pNick').innerText = u.nick; }
        function addB() { u.bal += parseInt(document.getElementById('bSum').value); upd(); alert('Баланс пополнен!'); }
        function buy() { document.getElementById('cOut').innerHTML += '<p style="color:#2ecc71; margin-top:5px;">✔ вы купили данный товар</p>'; }
        function saveP() { let nn = document.getElementById('nNick').value; if(nn) u.nick = nn; upd(); alert('Сохранено!'); }
        function sendR() {
            let m = document.getElementById('sMsg').value; if(!m) return;
            reps.push({n: u.nick, m: m}); document.getElementById('sMsg').value = ''; alert('Отправлено');
            let out = ''; reps.forEach(r => out += `<div class="rep"><span>${r.m}</span><span style="color:#2ecc71;">зеленый Репорт [${r.n}]</span></div>`);
            document.getElementById('aReps').innerHTML = out;
        }
    </script>
</body>
</html>
