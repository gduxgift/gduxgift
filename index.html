<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт на GitHub Pages</title>
    <style>
        /* Обнуляем отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Настройки фона */
        body {
            background-image: url('https://yandex.net');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0c0c0c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column; /* Размещаем элементы вертикально друг за другом */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Заголовок в самом верху страницы */
        .top-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        /* Контейнер для контента */
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        p {
            font-size: 1.1rem;
            color: #b3b3b3;
            line-height: 1.6;
        }

        /* Анимированная оранжевая кнопка «Далее» */
        .btn-next {
            display: inline-block;
            padding: 15px 45px;
            background: linear-gradient(135deg, #ff6a00, #ee0979); /* Красивый оранжево-розовый градиент */
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50px; /* Округлая форма */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(238, 9, 121, 0.7);
            animation: pulse 2s infinite; /* Подключение бесконечной анимации пульсации */
        }

        /* Эффект при наведении мыши */
        .btn-next:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.4);
            animation: none; /* Останавливаем пульсацию при наведении */
        }

        /* Нажатие кнопки */
        .btn-next:active {
            transform: scale(0.98);
        }

        /* Ключевые кадры для анимации пульсации кнопки */
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 106, 0, 0.7);
            }
            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 15px rgba(255, 106, 0, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 106, 0, 0);
            }
        }
    </style>
</head>
<body>

    <!-- Заголовок вверху -->
    <h1 class="top-title">Добро пожаловать</h1>

    <!-- Центральный блок с текстом -->
    <div class="container">
        <p>Мой будущий крутой сайт, который я создаю и размещаю с помощью GitHub Pages. Скоро здесь появится больше интересного контента!</p>
    </div>

    <!-- Анимированная кнопка внизу -->
    <a href="#" class="btn-next">Далее</a>

</body>
</html>
