<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('https://img.magnific.com/premium-vector/abstract-black-grey-wavy-background_291930-853.jpg?semt=ais_hybrid');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Первый экран */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            transition: opacity 0.5s ease;
        }

        h1 {
            color: #ffffff;
            font-size: 3rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        .btn-next {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-next:hover {
            background-color: #e65c00;
            transform: scale(1.05);
        }

        /* Второй экран */
        #auth-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 40px;
        }

        .nav-tabs {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            gap: 15px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #ff6600;
            color: white;
            border-color: #ff6600;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 16px;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .auth-form.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ff6600;
        }

        .submit-btn {
            background: #ff6600;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #e65c00;
        }

        .forgot-link {
            color: #ff6600;
            text-align: center;
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
            margin-top: 5px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Таблички-уведомления (Кастомные модалки) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .alert-box {
            background: #1a1a1a;
            border: 2px solid #ff6600;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .alert-box h3 {
            color: #ff6600;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .alert-box p {
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .alert-box button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ПЕРВЫЙ ЭКРАН -->
    <div id="welcome-screen">
        <h1>Добро пожаловать</h1>
        <button class="btn-next" onclick="showAuth()">Далее</button>
    </div>

    <!-- ВТОРОЙ ЭКРАН -->
    <div id="auth-screen">
        <div class="nav-tabs">
            <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Войти</button>
            <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Регистрация</button>
        </div>

        <div class="form-container">
            <!-- Форма Входа -->
            <form id="login-form" class="auth-form active" onsubmit="validateLogin(event)">
                <div class="input-group">
                    <label>Юзернейм Telegram или Почта</label>
                    <input type="text" id="login-user" placeholder="@username или email">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="login-pass" placeholder="Введи пароль">
                </div>
                <button type="submit" class="submit-btn">Войти</button>
                <a class="forgot-link" onclick="triggerForgot()">Забыли пароль?</a>
            </form>

            <!-- Форма Регистрации -->
            <form id="register-form" class="auth-form" onsubmit="validateRegister(event)">
                <div class="input-group">
                    <label>Ваш юзернейм из Telegram</label>
                    <input type="text" id="reg-tg" placeholder="@username">
                </div>
                <div class="input-group">
                    <label>Почта</label>
                    <input type="text" id="reg-email" placeholder="example@mail.com">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-pass1" placeholder="Придумай пароль">
                </div>
                <div class="input-group">
                    <label>Подтвердите пароль</label>
                    <input type="password" id="reg-pass2" placeholder="Повтори пароль">
                </div>
                <button type="submit" class="submit-btn">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- ТАБЛИЧКА ДЛЯ ОШИБОК -->
    <div id="custom-alert" class="modal-overlay">
        <div class="alert-box">
            <h3 id="alert-title">Внимание</h3>
            <p id="alert-msg">Текст ошибки</p>
            <button onclick="closeAlert()">Окей</button>
        </div>
    </div>

    <script>
        // Переход ко второму экрану
        function showAuth() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
        }

        // Переключение вкладок Войти / Регистрация
        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('login-form');
            const formRegister = document.getElementById('register-form');
            
            tabLogin.classList.remove('active');
            tabRegister.classList.remove('active');
            formLogin.classList.remove('active');
            formRegister.classList.remove('active');

            if(type === 'login') {
                tabLogin.classList.add('active');
                formLogin.classList.add('active');
            } else {
                tabRegister.classList.add('active');
                formRegister.classList.add('active');
            }
        }

        // Показ кастомной таблички
        function showAlert(title, text) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = text;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('custom-alert').style.display = 'none';
        }

        // Валидация Входа
        function validateLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if(!user) {
                showAlert('Ошибка', 'Вы пропустили строчку: Юзернейм Telegram или Почта');
                return;
            }
            if(!pass) {
                showAlert('Ошибка', 'Вы пропустили строчку: Пароль');
                return;
            }
            showAlert('Успешно', 'Вы вошли в систему!');
        }

        // Валидация Регистрации
        function validateRegister(e) {
            e.preventDefault();
            const tg = document.getElementById('reg-tg').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const p1 = document.getElementById('reg-pass1').value.trim();
            const p2 = document.getElementById('reg-pass2').value.trim();

            if(!tg) {
                showAlert('Ошибка', 'Вы пропустили строчку: Ваш юзернейм из Telegram');
                return;
            }
            if(!email) {
                showAlert('Ошибка', 'Вы пропустили строчку: Почта');
                return;
            }
            if(!p1) {
                showAlert('Ошибка', 'Вы пропустили строчку: Пароль');
                return;
            }
            if(!p2) {
                showAlert('Ошибка', 'Вы пропустили строчку: Подтвердите пароль');
                return;
            }
            if(p1 !== p2) {
                showAlert('Ошибка', 'Пароли не совпадают!');
                return;
            }
            showAlert('Успешно', 'Регистрация завершена!');
        }

        // Кнопка забыли пароль
        function triggerForgot() {
            showAlert('Восстановление', 'На вашу почту или Telegram пришел ваш предыдущий пароль, посмотрите.');
        }
    </script>
</body>
</html>
