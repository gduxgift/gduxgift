<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт на GitHub Pages</title>
    <style>
        /* Обнуляем отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Настройки нового фона с черной волной */
        body {
            background-image: url('https://aedcpr.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0c0c0c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Выравнивание контента от самого верха */
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px; /* Отступы по краям экрана */
        }

        /* Заголовок поднят максимально наверх */
        .top-title {
            font-size: 3rem;
            font-weight: 700;
            margin-top: 10px; /* Минимальный отступ от верхнего края */
            margin-bottom: 40px; /* Отступ до центрального блока */
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* Контейнер для контента */
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
            background: rgba(0, 0, 0, 0.4); /* Чуть затемнили подложку для читаемости на новом фоне */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 50px;
        }

        p {
            font-size: 1.1rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* Анимированная оранжевая кнопка «Далее» */
        .btn-next {
            display: inline-block;
            padding: 15px 50px;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(255, 106, 0, 0.7);
            animation: pulse 2s infinite;
        }

        /* Эффект при наведении мыши */
        .btn-next:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.5);
            animation: none;
        }

        /* Нажатие кнопки */
        .btn-next:active {
            transform: scale(0.98);
        }

        /* Ключевые кадры для анимации пульсации кнопки */
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 106, 0, 0.7);
            }
            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 15px rgba(255, 106, 0, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 106, 0, 0);
            }
        }
    </style>
</head>
<body>

    <!-- Заголовок поднят в самый верх -->
    <h1 class="top-title">Добро пожаловать</h1>

    <!-- Центральный блок с текстом -->
    <div class="container">
        <p>Мой будущий крутой сайт, который я создаю и размещаю с помощью GitHub Pages. Скоро здесь появится больше интересного контента!</p>
    </div>

    <!-- Анимированная кнопка внизу -->
    <a href="#" class="btn-next">Далее</a>

</body>
</html>
