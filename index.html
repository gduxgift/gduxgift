<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gduxgift</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f9; color: #2d3748; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Верхняя зафиксированная рамка-меню */
        .navbar { display: none; width: 100%; background: #fff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, #ff6a00, #ee0979); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu { display: flex; gap: 20px; font-weight: 600; cursor: pointer; }
        .profile { display: flex; align-items: center; gap: 10px; border-left: 1px solid #e2e8f0; padding-left: 15px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ff6a00; object-fit: cover; background: #e2e8f0; }
        .logout { font-size: 0.75rem; color: #a0aec0; cursor: pointer; background: none; border: none; font-weight: bold; }
        .logout:hover { color: #e53e3e; text-decoration: underline; }

        /* Окно авторизации */
        .welcome { text-align: center; margin-top: 60px; width: 100%; max-width: 380px; padding: 0 10px; }
        h1 { margin-bottom: 20px; text-transform: uppercase; font-size: 1.8rem; letter-spacing: 1px; }
        .box { background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        
        /* Вкладки Войти / Регистрация */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: 2px solid #ff6a00; color: #ff6a00; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #ff6a00; color: #fff; }
        
        .form-block { display: none; }
        .form-block.active { display: block; }

        label { display: block; font-size: 0.9rem; font-weight: 600; color: #4a5568; margin-top: 12px; }
        input { width: 100%; padding: 12px; margin: 6px 0 12px; border: 1px solid #cbd5e0; border-radius: 6px; outline: none; background: #f8fafc; }
        input:focus { border-color: #ff6a00; background: #fff; }
        .btn { width: 100%; padding: 14px; background: #ff6a00; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #e65c00; }
        
        #content { display: none; margin-top: 60px; text-align: center; }
    </style>
</head>
<body>

    <!-- Шапка (появляется при входе и остается после обновления страницы) -->
    <header class="navbar" id="navbar">
        <div class="logo">gduxgift</div>
        <nav class="menu">
            <div>🛒 Корзина</div>
            <div>🎧 Поддержка</div>
            <div>💰 Баланс: 0 ₽</div>
            <div>⚙️ Настройки</div>
        </nav>
        <div class="profile">
            <img src="" class="avatar" id="avatar" alt="Avatar">
            <div>
                <b id="user"></b><br>
                <button class="logout" onclick="logout()">Выйти</button>
            </div>
        </div>
    </header>

    <!-- Экраны авторизации -->
    <main class="welcome" id="welcomeSection">
        <h1>Добро пожаловать</h1>
        <div class="box">
            
            <!-- Переключатель вкладок -->
            <div class="tabs">
                <button class="tab-btn active" id="t-reg" onclick="switchTab('reg')">Регистрация</button>
                <button class="tab-btn" id="t-log" onclick="switchTab('log')">Войти</button>
            </div>

            <!-- БЛОК 1: РЕГИСТРАЦИЯ -->
            <div id="block-reg" class="form-block active">
                <label>Telegram юзернейм (без @)</label>
                <input type="text" id="reg-tg" placeholder="durov">
                <label>Электронная почта</label>
                <input type="email" id="reg-email" placeholder="example@mail.com">
                <label>Придумайте пароль</label>
                <input type="password" id="reg-p1">
                <label>Подтвердите пароль</label>
                <input type="password" id="reg-p2">
                <button type="button" class="btn" onclick="handleAuth('reg')">Создать аккаунт</button>
            </div>

            <!-- БЛОК 2: ВХОД -->
            <div id="block-log" class="form-block">
                <label>Telegram юзернейм (без @)</label>
                <input type="text" id="log-tg" placeholder="durov">
                <label>Пароль</label>
                <input type="password" id="log-p">
                <button type="button" class="btn" onclick="handleAuth('log')">Войти</button>
            </div>

        </div>
    </main>

    <!-- Контент авторизованной зоны -->
    <div id="content">
        <h2>🎉 Авторизация выполнена успешно! Вы вошли в gduxgift.</h2>
        <p style="color: #718096; margin-top: 10px;">Все данные сохранены, можете обновлять страницу.</p>
    </div>

    <script>
        // Жёсткая проверка наличия сессии при входе на сайт
        window.onload = function() {
            const savedUser = localStorage.getItem('gdux_user');
            if (savedUser) {
                showSite(savedUser);
            }
        };

        // Логика переключения между вкладками "Войти" и "Регистрация"
        function switchTab(type) {
            if (type === 'reg') {
                document.getElementById('block-reg').classList.add('active');
                document.getElementById('block-log').classList.remove('active');
                document.getElementById('t-reg').classList.add('active');
                document.getElementById('t-log').classList.remove('active');
            } else {
                document.getElementById('block-log').classList.add('active');
                document.getElementById('block-reg').classList.remove('active');
                document.getElementById('t-log').classList.add('active');
                document.getElementById('t-reg').classList.add('active');
                document.getElementById('t-reg').classList.remove('active');
                document.getElementById('t-log').classList.add('active');
            }
        }

        // Обработка кликов по кнопкам авторизации (без перезагрузки страницы)
        function handleAuth(mode) {
            if (mode === 'reg') {
                const username = document.getElementById('reg-tg').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const p1 = document.getElementById('reg-p1').value;
                const p2 = document.getElementById('reg-p2').value;

                if (!username || !email || !p1 || !p2) return alert("Заполните все поля!");
                if (p1 !== p2) return alert("Ошибка: Пароли не совпадают!");

                // Запись в память браузера
                localStorage.setItem('gdux_user', username);
                localStorage.setItem('gdux_pass', p1);
                
                showSite(username);
            } 
            
            if (mode === 'log') {
                const username = document.getElementById('log-tg').value.trim();
                const password = document.getElementById('log-p').value;
                
                const localUser = localStorage.getItem('gdux_user');
                const localPass = localStorage.getItem('gdux_pass');

                if (!username || !password) return alert("Заполните поля для входа!");

                if (username === localUser && password === localPass) {
                    showSite(username);
                } else {
                    alert("Неверный юзернейм или пароль! Убедитесь, что аккаунт зарегистрирован.");
                }
            }
        }

        // Показ верхней рамки и сайта
        function showSite(username) {
            document.getElementById('welcomeSection').style.display = 'none';
            document.getElementById('user').innerText = `@${username}`;

            // Сверхстабильный генератор аватаров на основе юзернейма
            const img = document.getElementById('avatar');
            img.src = `https://robohash.org{username}.png?set=set4`;

            // Активация верхней панели навигации
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('content').style.display = 'block';
        }

        // Полное логаутирование и очистка кэша сессии
        function logout() {
            localStorage.removeItem('gdux_user');
            localStorage.removeItem('gdux_pass');
            window.location.reload();
        }
    </script>
</body>
</html>
