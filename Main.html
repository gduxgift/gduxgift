<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gduxgift</title>
    <style>
        * { box-sizing: border-box; transition: 0.2s; border-radius: 14px; }
        body { margin: 0; font-family: sans-serif; background: #121212; color: #fff; text-align: center; }
        body.light { background: #fff; color: #121212; }
        .navbar { background: #1e1e1e; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 0; }
        body.light .navbar { background: #f5f5f5; }
        .logo { font-size: 18px; font-weight: bold; display: none; }
        .btn { background: transparent; border: 1px solid #ff9800; color: #ff9800; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .btn.orange { background: #ff9800; color: #fff; padding: 12px 30px; font-size: 16px; width: 100%; max-width: 220px; }
        .user-panel { display: none; border: 2px solid #ff9800; padding: 6px 12px; gap: 12px; font-size: 14px; }
        .container { padding: 30px 15px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .screen { display: none; width: 100%; max-width: 400px; }
        .screen.active { display: block; }
        .promo { background: rgba(255,152,0,0.1); border: 1px dashed #ff9800; padding: 12px; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 15px; }
        .modal-box { background: #1e1e1e; color: #fff; padding: 20px; width: 100%; max-width: 320px; text-align: left; position: relative; }
        body.light .modal-box { background: #f9f9f9; color: #121212; }
        input { width: 100%; padding: 8px; margin: 8px 0 15px; background: rgba(255,255,255,0.05); color: inherit; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="navbar">
        <div id="logo" class="logo">gduxgift</div>
        <div id="auth">
            <button class="btn" onclick="openM('reg')">Войти / Рега</button>
        </div>
        <div id="panel" class="user-panel">
            <span onclick="openM('bal')">💰 Баланс: <b id="bText">0.0</b></span>
            <span onclick="alert('Пусто')">🛒 Корзина</span>
            <span onclick="openM('prof')">👤 <b id="uText">Игрок</b></span>
            <span onclick="openM('set')">⚙️</span>
        </div>
    </div>

    <div class="container">
        <div id="s1" class="screen active">
            <h1 style="color:#fff;" id="wText">Добро Welcome</h1>
            <div style="font-size:70px; margin:20px;">🚀</div>
            <button class="btn orange" onclick="go2()">Далее</button>
        </div>

        <div id="s2" class="screen">
            <div class="promo">Получить промокод: <a href="https://t.me" style="color:#ff9800; font-weight:bold;">t.me/gduxgift</a></div>
            <p style="margin:25px 0; font-size:16px;">gduxgift — самое простое и лучшее решение</p>
            <button class="btn orange" onclick="location.href='https://t.me'">Далее</button>
        </div>
    </div>

    <!-- Модалки -->
    <div id="mReg" class="modal" onclick="closeM('mReg')"><div class="modal-box" onclick="event.stopPropagation()">
        <h3>Вход / Регистрация</h3>
        <input type="text" id="nickInp" value="Игрок" placeholder="Никнейм">
        <button class="btn orange" onclick="login()">Готово</button>
    </div></div>

    <div id="mBal" class="modal" onclick="closeM('mBal')"><div class="modal-box" onclick="event.stopPropagation()">
        <h3>Пополнение счета</h3>
        <input type="number" id="sumInp" min="500" max="2500" value="500" placeholder="От 500 до 2500">
        <button class="btn orange" onclick="addB()">Пополнить</button>
    </div></div>

    <div id="mProf" class="modal" onclick="closeM('mProf')"><div class="modal-box" onclick="event.stopPropagation()">
        <h3>Профиль</h3>
        <input type="text" id="newName" placeholder="Новый ник">
        <input type="text" placeholder="Ссылка на аватарку">
        <button class="btn orange" onclick="saveP()">Сохранить</button>
    </div></div>

    <div id="mSet" class="modal" onclick="closeM('mSet')"><div class="modal-box" onclick="event.stopPropagation()">
        <h3>Настройки темы</h3>
        <button class="btn" style="width:100%; margin-bottom:10px;" onclick="setT(true)">🤍 Белая</button>
        <button class="btn" style="width:100%;" onclick="setT(false)">🖤 Черная</button>
    </div></div>

    <script>
        let bal = 0.0;
        function go2() { document.getElementById('s1').style.display='none'; document.getElementById('s2').style.display='block'; document.getElementById('logo').style.display='block'; }
        function openM(id) { document.getElementById('m'+id.charAt(0).toUpperCase()+id.slice(1)).style.display='flex'; }
        function closeM(id) { document.getElementById(id).style.display='none'; }
        function login() { document.getElementById('uText').innerText = document.getElementById('nickInp').value || 'Игрок'; document.getElementById('auth').style.display='none'; document.getElementById('panel').style.display='flex'; closeM('mReg'); }
        function addB() { let s = parseFloat(document.getElementById('sumInp').value); if(s>=500 && s<=2500) { bal+=s; document.getElementById('bText').innerText=bal.toFixed(1); closeM('mBal'); } else alert('От 500 до 2500!'); }
        function saveP() { let n = document.getElementById('newName').value; if(n) document.getElementById('uText').innerText=n; closeM('mProf'); }
        function setT(l) { if(l) document.body.classList.add('light'); else document.body.classList.remove('light'); closeM('mSet'); }
    </script>
</body>
</html>
