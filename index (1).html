<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиум Портал</title>
    <style>
        /* Обнуление отступов и базовая настройка */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            color: #ffffff;
        }

        /* Полноэкранный задний фон */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://avatars.mds.yandex.net/i?id=2fbc9cff96c5a709a2167e2a7f54f959_l-5877417-images-thumbs&n=13');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Затемнение для читаемости текста */
        .background-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Контейнер для контента */
        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        /* Верхняя левая панель навигации (появляется позже) */
        .nav-corner {
            position: absolute;
            top: 30px;
            left: 30px;
            display: none; /* Скрыта по умолчанию */
            gap: 15px;
            z-index: 10;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        /* Заголовок сверху */
        .welcome-title {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 40px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            animation: fadeInDown 1s ease forwards;
        }

        /* Центральные экраны (формы) */
        .screen-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
        }

        .auth-card {
            background: rgba(15, 15, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: none; /* Появляется после клика "Далее" */
            animation: scaleIn 0.4s ease forwards;
        }

        .auth-card h2 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
            color: #f3f3f3;
        }

        /* Стили полей ввода */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        /* Синяя квадратно-мягкая кнопка */
        .blue-btn {
            background: #1d4ed8; /* Глубокий синий */
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 10px; /* Мягкие квадратные углы */
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 20px;
            z-index: 5;
        }

        .blue-btn:hover {
            background: #2563eb; /* Чуть светлее при наведении */
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            transform: translateY(-2px);
        }

        .blue-btn:active {
            transform: translateY(1px);
        }

        .submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
        }

        /* Состояние для авторизованного пользователя */
        .user-profile {
            text-align: center;
        }
        .user-profile p {
            font-size: 18px;
            color: #4ade80;
            margin-bottom: 15px;
        }

        /* Анимации */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Адаптивность для мобилок */
        @media(max-width: 600px) {
            .welcome-title { font-size: 2rem; }
            .nav-corner { top: 15px; left: 15px; width: calc(100% - 30px); justify-content: center; }
            .main-container { padding-top: 90px; }
        }
    </style>
</head>
<body>

    <!-- Фоновое изображение -->
    <div class="background-overlay"></div>

    <!-- Основной интерфейс сайта -->
    <div class="main-container">
        
        <!-- Угловые кнопки навигации (появятся на шаге 2) -->
        <div class="nav-corner" id="navCorner">
            <button class="nav-btn active" id="btnGoLogin" onclick="switchForm('login')">Войти</button>
            <button class="nav-btn" id="btnGoRegister" onclick="switchForm('register')">Зарегистрироваться</button>
        </div>

        <!-- Верхний заголовок -->
        <h1 class="welcome-title" id="welcomeText">Добро пожаловать</h1>

        <!-- Центральная интерактивная зона -->
        <div class="screen-content">
            
            <!-- Карточка Входа / Регистрации -->
            <div class="auth-card" id="authCard">
                
                <!-- Форма Входа -->
                <div id="loginFormSub">
                    <h2>Авторизация</h2>
                    <div class="form-group">
                        <label>Email / Почта</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button class="blue-btn submit-btn" onclick="handleLogin()">Войти в систему</button>
                </div>

                <!-- Форма Регистрации -->
                <div id="registerFormSub" style="display: none;">
                    <h2>Создать аккаунт</h2>
                    <div class="form-group">
                        <label>Email / Почта</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label>Telegram Юзернейм</label>
                        <input type="text" id="regTelegram" class="form-control" placeholder="@username" required>
                    </div>
                    <div class="form-group">
                        <label>Придумайте Пароль</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="Надежный пароль" required>
                    </div>
                    <button class="blue-btn submit-btn" onclick="handleRegister()">Зарегистрироваться</button>
                </div>

                <!-- Экран успешного входа (Запоминание человека) -->
                <div id="welcomeUserBlock" style="display: none;" class="user-profile">
                    <p id="successMessage">Вы успешно вошли!</p>
                    <div style="font-size: 14px; color: #ccc; margin-bottom: 20px;" id="userInfoDump"></div>
                    <button class="nav-btn" onclick="handleLogout()" style="width:100%">Выйти из аккаунта</button>
                </div>

            </div>

        </div>

        <!-- Нижняя синяя квадратно-мягкая кнопка "Далее" -->
        <button class="blue-btn" id="mainNextBtn" onclick="clickNext()">Далее</button>

    </div>

    <script>
        // Проверка: регистрировался ли пользователь ранее?
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('registeredUser');
            if (savedUser) {
                // Если человека запомнили, меняем текст на главном экране
                document.getElementById('welcomeText').innerText = "Рады видеть вас снова!";
            }
        });

        // Функция нажатия на кнопку "Далее"
        function clickNext() {
            // Прячем нижнюю кнопку "Далее"
            document.getElementById('mainNextBtn').style.display = 'none';
            // Показываем верхнее меню слева "Войти / Зарегистрироваться"
            document.getElementById('navCorner').style.display = 'flex';
            // Показываем блок с карточкой форм
            document.getElementById('authCard').style.opacity = '0';
            document.getElementById('authCard').style.display = 'block';
            
            // Если пользователь уже сохранен в памяти — сразу переводим на страницу успешного входа
            const savedUser = localStorage.getItem('registeredUser');
            if (savedUser) {
                showWelcomeUser(JSON.parse(savedUser), "С возвращением!");
            } else {
                // Иначе открываем форму входа по умолчанию
                switchForm('login');
            }
        }

        // Переключение вкладок "Войти" и "Зарегистрироваться"
        function switchForm(type) {
            const loginForm = document.getElementById('loginFormSub');
            const registerForm = document.getElementById('registerFormSub');
            const userBlock = document.getElementById('welcomeUserBlock');
            
            // Если пользователь авторизован, вкладки не переключаем обратно до логаута
            if(userBlock.style.display === 'block') return;

            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                document.getElementById('btnGoLogin').classList.add('active');
                document.getElementById('btnGoRegister').classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                document.getElementById('btnGoLogin').classList.remove('active');
                document.getElementById('btnGoRegister').classList.add('active');
            }
        }

        // Логика первой регистрации
        function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const telegram = document.getElementById('regTelegram').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!email || !telegram || !password) {
                alert("Пожалуйста, заполните все поля регистрации!");
                return;
            }

            // Создаем объект пользователя
            const userObj = {
                email: email,
                telegram: telegram,
                password: password
            };

            // Запоминаем человека в браузере навсегда
            localStorage.setItem('registeredUser', JSON.stringify(userObj));
            
            // Меняем интерфейс на успешный статус
            showWelcomeUser(userObj, "Регистрация успешна! Система вас запомнила.");
        }

        // Логика авторизации (входа)
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const savedUserRaw = localStorage.getItem('registeredUser');

            if (!savedUserRaw) {
                alert("Пользователь не найден. Пожалуйста, сначала пройдите регистрацию!");
                switchForm('register');
                return;
            }

            const savedUser = JSON.parse(savedUserRaw);

            if (savedUser.email === email && savedUser.password === password) {
                showWelcomeUser(savedUser, "Вы успешно авторизовались!");
            } else {
                alert("Неверная почта или пароль!");
            }
        }

        // Показ финального экрана профиля
        function showWelcomeUser(user, messageTitle) {
            document.getElementById('loginFormSub').style.display = 'none';
            document.getElementById('registerFormSub').style.display = 'none';
            
            const userBlock = document.getElementById('welcomeUserBlock');
            userBlock.style.display = 'block';
            
            document.getElementById('successMessage').innerText = messageTitle;
            document.getElementById('userInfoDump').innerHTML = `
                <p style="margin-top:5px;"><strong>Почта:</strong> ${user.email}</p>
                <p style="margin-top:5px;"><strong>Telegram:</strong> ${user.telegram}</p>
            `;
            
            // Обновляем главный заголовок сайта
            document.getElementById('welcomeText').innerText = `Добро пожаловать, ${user.telegram}!`;
        }

        // Кнопка выхода (чтобы можно было протестировать заново)
        function handleLogout() {
            if(confirm("Очистить данные сессии и выйти?")) {
                localStorage.removeItem('registeredUser');
                document.getElementById('welcomeUserBlock').style.display = 'none';
                document.getElementById('welcomeText').innerText = "Добро пожаловать";
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('navCorner').style.display = 'none';
                document.getElementById('mainNextBtn').style.display = 'block';
                
                // Очищаем инпуты
                document.getElementById('regEmail').value = '';
                document.getElementById('regTelegram').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
            }
        }
    </script>
</body>
</html>
